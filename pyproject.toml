[project]
name = "strategy-lab"
version = "0.1.0"
description = "Walk-forward portfolio backtesting framework"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  {name = "Sami", email = "samitochelha@gmail.com"}
]

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "yfinance",
    "streamlit",
    "plotly",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_lab"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
